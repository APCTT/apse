services:
  - type: web
    name: apse-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KOREA_NTB_API_KEY
        sync: false
      - key: KOREA_NTB_BASE_URL
        value: https://apis.data.go.kr/B552536/tech_4/techall
      - key: KOREA_NTB_TTL_SECONDS
        value: 86400
      - key: CACHE_TTL_SECONDS
        value: 86400
      - key: GEMINI_API_KEY
        sync: false
      - key: SEMANTIC_SEARCH_ENABLED
        value: true
      - key: SEMANTIC_SEARCH_INDEX_PATH
        value: backend/search/data/semantic_index.db
      - key: SEMANTIC_SEARCH_DB_PATH
        value: backend/cache/semantic_search.db
